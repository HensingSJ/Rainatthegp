name: Build & deploy

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC)
  workflow_dispatch:       # "Run workflow" button in GitHub
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write          # needed to save data/history back to the repository

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build pages with live data
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://rainatthegp.com' }}
          F1_TRACK_WEATHER: ${{ vars.F1_TRACK_WEATHER || 'on' }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rainatthegp --branch=main
      - name: Save forecasts and outcomes
        run: |
          if [ ! -d data/history ]; then echo "No history yet"; exit 0; fi
          git add data/history
          if git diff --cached --quiet; then echo "No history changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update forecast history"
          # Another run may have saved the same file in the meantime: keep this (newer) version
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
